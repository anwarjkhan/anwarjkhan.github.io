name: Job search digest

on:
  schedule:
    # GitHub cron is UTC. 04:30 + 11:00 UTC ≈ 05:30 + 12:00 London (BST).
    - cron: "30 4 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:

concurrency:
  group: job-agent-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r job-agent/requirements.txt
      - name: Run job search agent
        working-directory: job-agent/src
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python job_search.py
      - name: Persist seen-jobs state
        run: |
          git config user.name "job-agent[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add job-agent/data
          if ! git diff --cached --quiet; then
            git commit -m "chore(job-agent): update seen jobs [skip ci]"
            git pull --rebase
            git push
          fi
