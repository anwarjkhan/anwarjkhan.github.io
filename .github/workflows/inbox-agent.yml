name: Inbox triage agent

on:
  schedule:
    # Every 2 hours, 06:00-20:00 UTC.
    - cron: "15 6-20/2 * * *"
  workflow_dispatch:

concurrency:
  group: job-agent-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r job-agent/requirements.txt
      - name: Run inbox agent
        working-directory: job-agent/src
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python inbox_agent.py
      - name: Persist inbox state
        run: |
          git config user.name "job-agent[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add job-agent/data
          if ! git diff --cached --quiet; then
            git commit -m "chore(job-agent): update inbox state [skip ci]"
            git pull --rebase
            git push
          fi
